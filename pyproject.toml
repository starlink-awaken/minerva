[project]
name = "minerva"
version = "0.11.0"
description = "Minerva — A local-first deep research system with tiered pipelines, multi-source search, knowledge graphs, symbolic paradigm engine, and temporal reasoning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Minerva Contributors"}]
keywords = ["deep-research", "knowledge-graph", "rag", "llm", "agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "httpx>=0.27",
    "lancedb>=0.21",
    "pyyaml>=6.0",
    "croniter>=6.0",
    "spacy>=3.8",
    "sentence-transformers>=3.0",
    "pydantic>=2.0",
    "fastmcp>=0.1",
    "structlog>=24.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "apscheduler>=3.10",
    "ddgs>=8.0",
    "ujson>=5.12.1",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
paradigm = ["sophia>=0.2.0"]
tier2 = [
    "graphiti-core[neo4j]>=0.28",
    "semantica>=0.4.0",
    "neo4j>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.0",
]

[project.scripts]
minerva = "minerva.cli:main"
minerva-mcp = "minerva.mcp_server.server:main"
minerva-daemon = "minerva.executor.daemon:main"

[project.urls]
Homepage = "https://github.com/starlink-awaken/minerva"
Repository = "https://github.com/starlink-awaken/minerva.git"
Documentation = "https://github.com/starlink-awaken/minerva#readme"
Issues = "https://github.com/starlink-awaken/minerva/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
